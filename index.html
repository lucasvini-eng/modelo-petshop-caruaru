<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto em Desenvolvimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --color-accent: #b86e28;
            --color-accent-hover: #98561c;
            --color-accent-light: rgba(184, 110, 40, 0.12);
            --color-accent-border: rgba(184, 110, 40, 0.35);
            --color-dark: #0d0e12;
            --color-darker: #060709;
            --color-card: #13151b;
            --color-card-hover: #1a1d26;
            --color-border: rgba(255, 255, 255, 0.08);
            --color-text-muted: #9ab0c2;
            --color-status-concluido-darkgreen: #22c55e1f;
            --color-status-concluido-border: #22c55e59;
            --color-status-concluido-text: #4ade80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-darker);
            color: #ffffff;
            overflow-x: hidden;
        }
        .ambient-glow-top {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(184, 110, 40, 0.18) 0%, rgba(6, 7, 9, 0) 70%);
            top: -220px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            pointer-events: none;
        }

        .ambient-glow-bottom {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(184, 110, 40, 0.1) 0%, rgba(6, 7, 9, 0) 70%);
            bottom: -150px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-darker);
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2430;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-accent);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.15); }
        }
        .pulse-accent {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        accent: {
                            DEFAULT: '#b86e28',
                            hover: '#98561c',
                            light: 'rgba(184, 110, 40, 0.12)',
                            border: 'rgba(184, 110, 40, 0.35)',
                        },
                        dark: '#0d0e12',
                        darker: '#060709',
                        card: {
                            DEFAULT: '#13151b',
                            hover: '#1a1d26',
                        },
                        borderCustom: 'rgba(255, 255, 255, 0.08)',
                        textMuted: '#9ab0c2',
                        status: {
                            concluidoBg: '#22c55e1f',
                            concluidoBorder: '#22c55e59',
                            concluidoText: '#4ade80',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen max-h-screen flex flex-col justify-between overflow-hidden selection:bg-[#b86e28] selection:text-white">

    <div class="ambient-glow-top"></div>
    <div class="ambient-glow-bottom"></div>

    <header class="relative z-10 w-full border-b border-[rgba(255,255,255,0.08)] bg-[#0d0e12]/80 backdrop-blur-md shrink-0">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-[#13151b] border border-[rgba(184,110,40,0.35)] flex items-center justify-center shadow-lg shadow-[#b86e28]/10">
                    <i class="fa-solid fa-hourglass-half text-[#b86e28] text-base sm:text-lg"></i>
                </div>
                <div>
                    <span class="font-bold text-base sm:text-lg tracking-tight text-white block leading-none">PROJETO<span class="text-[#b86e28]">.DEV</span></span>
                    <span class="text-xs text-[#9ab0c2]">Sistema em Construção</span>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div class="flex items-center px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-full bg-[#22c55e1f] border border-[#22c55e59] text-[#4ade80] text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-[#4ade80] mr-2 animate-pulse"></span>
                    Desenvolvimento Ativo
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-grow flex items-center justify-center p-4">
        <div class="max-w-2xl mx-auto w-full text-center">

            <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-[rgba(184,110,40,0.12)] border border-[rgba(184,110,40,0.35)] mb-6">
                <span class="w-2.5 h-2.5 rounded-full bg-[#b86e28] pulse-accent"></span>
                <span class="text-xs sm:text-sm font-semibold text-[#b86e28] tracking-wider uppercase">Previsão Oficial: 15 de Agosto de 2026</span>
            </div>

            <div class="bg-[#13151b] border border-[rgba(184,110,40,0.35)] rounded-3xl p-6 sm:p-10 shadow-2xl shadow-black/60 relative overflow-hidden group">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-[#b86e28]/10 rounded-full blur-2xl group-hover:bg-[#b86e28]/20 transition-all duration-500"></div>

                <span class="text-xs sm:text-sm font-bold text-[#9ab0c2] uppercase tracking-widest block mb-2">Faltam Exatamente</span>
                
                <div class="flex items-center justify-center space-x-2 my-2">
                    <span id="days-counter" class="text-7xl sm:text-9xl font-black tracking-tight text-white transition-all duration-300">05</span>
                </div>

                <div class="inline-block bg-[rgba(184,110,40,0.12)] border border-[rgba(184,110,40,0.35)] px-6 py-2 rounded-full mt-2">
                    <span id="days-label" class="text-base sm:text-xl font-bold text-[#b86e28] tracking-wide">Dias Restantes</span>
                </div>

                <div class="mt-8 pt-6 border-t border-[rgba(255,255,255,0.08)] flex flex-col sm:flex-row items-center justify-between gap-3 text-xs sm:text-sm text-[#9ab0c2]">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-calendar-check text-[#b86e28]"></i>
                        <span>Data do Lançamento: <strong class="text-white">15/08/2026</strong></span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-code-commit text-[#4ade80]"></i>
                        <span>Status: <span class="text-[#4ade80] font-semibold">Dentro do Cronograma</span></span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="relative z-10 border-t border-[rgba(255,255,255,0.08)] bg-[#060709] py-4 shrink-0">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2 text-center sm:text-left">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-code text-[#b86e28] text-xs"></i>
                <span class="text-xs text-[#9ab0c2]">© 2026 Todos os direitos reservados. Entrega prev. para <strong>15/08/2026</strong>.</span>
            </div>
            <div class="text-xs text-[#9ab0c2] flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-[#4ade80]"></span>
                <span>Servidores Operacionais</span>
            </div>
        </div>
    </footer>

    <script>
        const targetDate = new Date('2026-08-15T00:00:00');

        function calculateDaysRemaining() {
            const now = new Date();
            const differenceMs = targetDate.getTime() - now.getTime();

            if (differenceMs <= 0) {
                return 0;
            }
            const days = Math.ceil(differenceMs / (1000 * 60 * 60 * 24));
            return days;
        }

        function updateDaysCounter() {
            const daysElement = document.getElementById('days-counter');
            const labelElement = document.getElementById('days-label');
            
            if (!daysElement) return;

            const remainingDays = calculateDaysRemaining();
            const formattedDays = remainingDays < 15 && remainingDays >= 0 ? `0${remainingDays}` : remainingDays;
            
            daysElement.innerText = formattedDays;

            if (labelElement) {
                labelElement.innerText = remainingDays === 1 ? 'Dia Restante' : 'Dias Restantes';
            }
        }
        window.addEventListener('DOMContentLoaded', () => {
            updateDaysCounter();
            setInterval(updateDaysCounter, 60000);
        });
    </script>
</body>
</html>
